server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Astro writes extensionless routes as directory indexes (about/index.html).
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
